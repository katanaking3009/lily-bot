<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; font-family: sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #status {
      position: absolute; top: 12px; left: 12px;
      background: rgba(255, 255, 255, 0.9); color: #d63384;
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="status">🌸 Summoning Lily-Hime...</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    const status = document.getElementById('status');
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(28.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
    camera.position.set(0.0, 1.32, 1.85);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, 1.20, 0.0);
    controls.enableDamping = true;
    controls.update();

    const scene = new THREE.Scene();
    scene.add(new THREE.DirectionalLight(0xffffff, 1.2));
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    // Direct Base64 decoding (100% reliable, zero caching bugs)
    const b64 = "__VRM_BASE64__";
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blobUrl = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));

    let currentVrm = null;
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load(blobUrl, (gltf) => {
      const vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.rotateVRM0(vrm);
      vrm.scene.traverse((obj) => { obj.frustumCulled = false; });

      // Relax arms down naturally
      const h = vrm.humanoid;
      const lArm = h?.getNormalizedBoneNode('leftUpperArm');
      const rArm = h?.getNormalizedBoneNode('rightUpperArm');
      if (lArm) lArm.rotation.z = 1.18;
      if (rArm) rArm.rotation.z = -1.18;

      scene.add(vrm.scene);
      currentVrm = vrm;
      status.style.display = 'none';
    }, undefined, (err) => {
      status.textContent = "Error loading VRM";
      console.error(err);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (currentVrm) {
        currentVrm.update(delta);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
