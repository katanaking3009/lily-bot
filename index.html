<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
        #canvas-container { width: 100vw; height: 100vh; background: radial-gradient(circle, #FFF4E8 0%, #FFE4D6 100%); position: relative; }
        #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #FF4500; font-family: sans-serif; font-weight: bold; font-size: 16px; text-align: center; pointer-events: none; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="status">🌸 Summoning Lily-Hime...</div>
    </div>

    <!-- FIXED: Swapped to rapid, high-uptime CDNJS production script routers -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const statusDiv = document.getElementById('status');
        const modelUrl = "https://githubusercontent.com";

        function start3DScene() {
            try {
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0.0, 1.4, 2.5);

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(1);
                renderer.outputEncoding = THREE.sRGBEncoding;
                container.appendChild(renderer.domElement);

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.target.set(0.0, 1.3, 0.0);
                controls.enableZoom = false;
                controls.update();

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(1.0, 2.0, 2.0).normalize();
                scene.add(dirLight);

                statusDiv.innerText = "📥 Syncing Avatar... 🌸";

                const loader = new THREE.GLTFLoader();
                let currentVrm = null;
                let startTime = null;

                loader.load(
                    modelUrl,
                    (gltf) => {
                        THREE.VRM.from(gltf).then((vrm) => {
                            currentVrm = vrm;
                            scene.add(vrm.scene);
                            vrm.scene.rotation.y = Math.PI; 
                            statusDiv.style.display = "none";
                            startTime = Date.now();
                        }).catch(err => {
                            statusDiv.innerText = "❌ VRM Engine Error: " + err.message;
                        });
                    },
                    (progress) => {
                        if (progress.total > 0) {
                            let percent = Math.round((progress.loaded / progress.total) * 100);
                            statusDiv.innerText = "📥 Downloading Assets: " + percent + "%";
                        }
                    },
                    (error) => {
                        statusDiv.innerText = "❌ File Download Blocked.";
                    }
                );

                const clock = new THREE.Clock();
                function animate() {
                    requestAnimationFrame(animate);
                    const deltaTime = clock.getDelta();
                    const time = clock.getElapsedTime();

                    if (currentVrm && currentVrm.humanoid) {
                        currentVrm.update(deltaTime);
                        let elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;

                        const leftArm = currentVrm.humanoid.getBoneNode(THREE.VRMBoneName.LeftUpperArm);
                        const rightArm = currentVrm.humanoid.getBoneNode(THREE.VRMBoneName.RightUpperArm);
                        const rightForearm = currentVrm.humanoid.getBoneNode(THREE.VRMBoneName.RightLowerArm);
                        const head = currentVrm.humanoid.getBoneNode(THREE.VRMBoneName.Head);

                        if (elapsed < 6.0 && startTime !== null) {
                            camera.position.z = 2.5 - (elapsed * 0.11);
                            if (leftArm) leftArm.rotation.z = 1.2;
                            if (rightArm) {
                                rightArm.rotation.z = -0.5;
                                rightArm.rotation.x = -0.2;
                            }
                            if (rightForearm) rightForearm.rotation.y = 1.0 + Math.sin(time * 8.0) * 0.2;
                            if (head) head.rotation.z = Math.sin(time * 2.0) * 0.05;

                            if (currentVrm.blendShapeProxy) {
                                currentVrm.blendShapeProxy.setValue(THREE.VRMBlendShapePresetName.Joy, 0.9);
                                if (Math.floor(elapsed) % 3 === 0 && elapsed % 1 < 0.2) {
                                    currentVrm.blendShapeProxy.setValue(THREE.VRMBlendShapePresetName.Blink, 1.0);
                                } else {
                                    currentVrm.blendShapeProxy.setValue(THREE.VRMBlendShapePresetName.Blink, 0.0);
                                }
                            }
                        } else {
                            camera.position.set(0.0, 1.4, 1.85);
                            if (leftArm) leftArm.rotation.z = 1.3 + Math.sin(time * 1.5) * 0.02;
                            if (rightArm) rightArm.rotation.z = -1.3 - Math.sin(time * 1.5) * 0.02;
                            if (rightForearm) rightForearm.rotation.y = 0.0;
                            if (head) head.rotation.z = 0.0;

                            if (currentVrm.blendShapeProxy) {
                                currentVrm.blendShapeProxy.setValue(THREE.VRMBlendShapePresetName.Joy, 0.2);
                                let blinkCycle = Math.sin(time * 3.5);
                                if (blinkCycle > 0.96) {
                                    currentVrm.blendShapeProxy.setValue(THREE.VRMBlendShapePresetName.Blink, 1.0);
                                } else {
                                    currentVrm.blendShapeProxy.setValue(THREE.VRMBlendShapePresetName.Blink, 0.0);
                                }
                            }
                        }
                        const chest = currentVrm.humanoid.getBoneNode(THREE.VRMBoneName.Chest);
                        if (chest) chest.rotation.z = Math.sin(time * 2.0) * 0.008;
                    }
                    renderer.render(scene, camera);
                }
                animate();

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

            } catch(e) {
                statusDiv.innerText = "💥 Canvas Crash: " + e.message;
            }
        }

        let checkAttempts = 0;
        const checkLoop = setInterval(() => {
            checkAttempts++;
            if (typeof THREE !== 'undefined' && typeof THREE.GLTFLoader !== 'undefined' && typeof THREE.VRM !== 'undefined') {
                clearInterval(checkLoop);
                start3DScene();
            } else if (checkAttempts > 150) { // Extended search buffer to ensure engine mounts
                clearInterval(checkLoop);
                statusDiv.innerText = "❌ Connection timed out. Trying to reload scene components...";
                setTimeout(start3DScene, 1000);
            }
        }, 100);
    </script>
</body>
</html>
