<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg-gradient, radial-gradient(circle at 50% 35%, #fff0f6 0%, #ffd6e7 100%));
      font-family: sans-serif;
      transition: background 0.8s ease;
    }
    canvas { width: 100vw; height: 100vh; display: block; cursor: pointer; }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.94);
      color: #c2185b;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      z-index: 10;
      max-width: 90vw;
      word-break: break-word;
    }
    #emotion-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.92);
      color: #c2185b;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(255, 105, 180, 0.25);
      z-index: 10;
    }
    #sound-hint {
      position: absolute;
      bottom: 8px;
      left: 10px;
      background: rgba(255, 255, 255, 0.82);
      color: #ad1457;
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 11px;
      pointer-events: none;
      z-index: 10;
    }
    .bottom-controls {
      position: absolute;
      bottom: 8px;
      right: 10px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }
    .hud-btn {
      background: linear-gradient(135deg, #ff4da6, #ff85c0);
      color: white;
      border: none;
      padding: 5px 11px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(255, 77, 166, 0.4);
      transition: transform 0.15s ease;
    }
    .hud-btn:hover { transform: scale(1.06); }
    #bgm-btn { background: linear-gradient(135deg, #00b4db, #0083b0); }
    #fs-btn { background: linear-gradient(135deg, #7928ca, #ff0080); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="status">Summoning __CHAR_NAME__...</div>
  <div id="emotion-badge">Ready</div>
  <div id="sound-hint">Tap character to interact</div>
  <div class="bottom-controls">
    <button id="bgm-btn" class="hud-btn" title="Toggle Chill Ambient BGM">BGM: Off</button>
    <button id="snap-btn" class="hud-btn" title="Take Wallpaper Screenshot">Snap</button>
    <button id="fs-btn" class="hud-btn" title="Toggle True Full Screen">Full Screen</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    const status = document.getElementById('status');
    const badge = document.getElementById('emotion-badge');
    const bgmBtn = document.getElementById('bgm-btn');
    const snapBtn = document.getElementById('snap-btn');
    const fsBtn = document.getElementById('fs-btn');
    let activeCharName = "__CHAR_NAME__";
    let loadedModelUrl = "";

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.98;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(26.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
    camera.position.set(0.0, 1.30, 1.65);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, 1.22, 0.0);
    controls.enableDamping = true;
    controls.update();

    const camPosTarget = new THREE.Vector3(0.0, 1.30, 1.65);
    const ctrlTarget = new THREE.Vector3(0.0, 1.22, 0.0);

    const scene = new THREE.Scene();
    const keyLight = new THREE.DirectionalLight(0xfff5f8, 1.35);
    keyLight.position.set(1.2, 1.6, 1.5);
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x00ffff, 0.0, 6.0);
    rimLight.position.set(-1.2, 1.4, -0.8);
    scene.add(rimLight);

    const ambLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambLight);

    let audioCtx = null;
    let bgmPlaying = false;
    let bgmInterval = null;
    let rainNode = null;
    let bgmGain = null;

    function toggleAmbientBGM() {
      if (bgmPlaying) {
        bgmPlaying = false;
        bgmBtn.textContent = "BGM: Off";
        if (bgmInterval) clearInterval(bgmInterval);
        if (rainNode) { try { rainNode.stop(); } catch(e) {} rainNode = null; }
        if (bgmGain && audioCtx) bgmGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.2);
        return;
      }
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      bgmPlaying = true;
      bgmBtn.textContent = "BGM: On";
      bgmGain = audioCtx.createGain();
      bgmGain.gain.setValueAtTime(0.045, audioCtx.currentTime);
      bgmGain.connect(audioCtx.destination);

      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

      rainNode = audioCtx.createBufferSource();
      rainNode.buffer = noiseBuffer;
      rainNode.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 420;

      const rainGain = audioCtx.createGain();
      rainGain.gain.value = 0.22;

      rainNode.connect(filter);
      filter.connect(rainGain);
      rainGain.connect(bgmGain);
      rainNode.start();

      const chords = [
        [349.23, 440.00, 523.25, 659.25],
        [329.63, 392.00, 493.88, 587.33],
        [293.66, 349.23, 440.00, 523.25],
        [261.63, 329.63, 392.00, 493.88]
      ];
      let step = 0;
      const playChord = () => {
        if (!bgmPlaying || !audioCtx) return;
        const now = audioCtx.currentTime;
        const freqs = chords[step % chords.length];
        step++;
        freqs.forEach((f) => {
          const osc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now);
          noteGain.gain.setValueAtTime(0.001, now);
          noteGain.gain.exponentialRampToValueAtTime(0.14, now + 0.4);
          noteGain.gain.exponentialRampToValueAtTime(0.001, now + 3.4);
          osc.connect(noteGain);
          noteGain.connect(bgmGain);
          osc.start(now);
          osc.stop(now + 3.5);
        });
      };
      playChord();
      bgmInterval = setInterval(playChord, 3600);
    }

    bgmBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleAmbientBGM(); });

    const stageGroup = new THREE.Group();
    scene.add(stageGroup);

    const neonGrid = new THREE.GridHelper(3.6, 18, 0xff2a85, 0x00f0ff);
    neonGrid.position.y = 0.01;
    neonGrid.material.transparent = true;
    neonGrid.material.opacity = 0.55;
    stageGroup.add(neonGrid);

    const sakuraCanvas = document.createElement('canvas');
    sakuraCanvas.width = 256; sakuraCanvas.height = 256;
    const sCtx = sakuraCanvas.getContext('2d');
    sCtx.strokeStyle = '#ff69b4';
    sCtx.lineWidth = 5;
    sCtx.beginPath(); sCtx.arc(128, 128, 115, 0, Math.PI * 2); sCtx.stroke();
    sCtx.strokeStyle = '#ffb3d9';
    sCtx.lineWidth = 3;
    sCtx.beginPath(); sCtx.arc(128, 128, 88, 0, Math.PI * 2); sCtx.stroke();
    for (let i = 0; i < 8; i++) {
      const ang = (i * Math.PI) / 4;
      sCtx.beginPath();
      sCtx.moveTo(128 + Math.cos(ang) * 45, 128 + Math.sin(ang) * 45);
      sCtx.lineTo(128 + Math.cos(ang) * 115, 128 + Math.sin(ang) * 115);
      sCtx.stroke();
    }
    const sakuraTex = new THREE.CanvasTexture(sakuraCanvas);
    const sakuraFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(1.6, 1.6),
      new THREE.MeshBasicMaterial({ map: sakuraTex, transparent: true, opacity: 0.75, side: THREE.DoubleSide, depthWrite: false })
    );
    sakuraFloor.rotation.x = -Math.PI / 2;
    sakuraFloor.position.y = 0.01;
    stageGroup.add(sakuraFloor);

    const studioDisc = new THREE.Mesh(
      new THREE.CircleGeometry(0.75, 48),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, depthWrite: false })
    );
    studioDisc.rotation.x = -Math.PI / 2;
    studioDisc.position.y = 0.005;
    stageGroup.add(studioDisc);

    function applyStageFloor(floorMode) {
      neonGrid.visible = floorMode.includes("Neon Grid");
      sakuraFloor.visible = floorMode.includes("Sakura Circle");
      studioDisc.visible = floorMode.includes("Studio Disc");
    }
    applyStageFloor("Sakura Circle");

    function applyLightingTheme(theme) {
      if (!theme || theme.includes("Auto")) {
        const hour = new Date().getHours();
        if (hour >= 18 || hour < 6) theme = "Moonlight";
        else if (hour >= 16) theme = "Golden Sunset";
        else theme = "Studio Softbox";
      }

      if (theme.includes("Cyberpunk")) {
        document.body.style.setProperty('--bg-gradient', 'radial-gradient(circle at 50% 35%, #240b36 0%, #0a0414 100%)');
        keyLight.color.setHex(0xff2a85); keyLight.intensity = 1.6;
        rimLight.color.setHex(0x00f0ff); rimLight.intensity = 2.4;
        ambLight.color.setHex(0x2a1b4e); ambLight.intensity = 0.55;
      } else if (theme.includes("Sunset")) {
        document.body.style.setProperty('--bg-gradient', 'radial-gradient(circle at 50% 35%, #ffd1b3 0%, #ff8da1 100%)');
        keyLight.color.setHex(0xff9e5e); keyLight.intensity = 1.55;
        rimLight.color.setHex(0xffcc00); rimLight.intensity = 0.8;
        ambLight.color.setHex(0xffe4d6); ambLight.intensity = 0.55;
      } else if (theme.includes("Moonlight")) {
        document.body.style.setProperty('--bg-gradient', 'radial-gradient(circle at 50% 35%, #162238 0%, #090d16 100%)');
        keyLight.color.setHex(0x9bb8ff); keyLight.intensity = 1.15;
        rimLight.color.setHex(0x6688ff); rimLight.intensity = 1.2;
        ambLight.color.setHex(0x3a4b6e); ambLight.intensity = 0.45;
      } else {
        document.body.style.setProperty('--bg-gradient', 'radial-gradient(circle at 50% 35%, #fff0f6 0%, #ffd6e7 100%)');
        keyLight.color.setHex(0xfff5f8); keyLight.intensity = 1.35;
        rimLight.intensity = 0.0;
        ambLight.color.setHex(0xffffff); ambLight.intensity = 0.65;
      }
    }
    applyLightingTheme("Studio Softbox");

    let currentVrm = null;
    let baseRotationY = 0.0;
    let blushGroup = null;
    let accObjects = {};
    let activeActionsList = ["wave"];
    let actionDuration = 5.0;
    let lastSpokenText = "";
    let touchReaction = false;
    let spinTimer = 0.0;

    let isSpeakingNow = false;
    let talkFallbackTimer = 0.0;
    let currentVowel = "aa";
    let syllableEnergy = 0.0;
    let voiceSettings = { profile: "Auto Female", pitch: 1.32, rate: 1.05 };

    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    const pointer = new THREE.Vector2(0, 0);
    const raycaster = new THREE.Raycaster();

    fsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const docEl = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (docEl.requestFullscreen) docEl.requestFullscreen();
        else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? "Exit Full" : "Full Screen";
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    snapBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      activeActionsList = ["pose", "blush"];
      actionDuration = 4.0;
      badge.textContent = "Snapshot Captured";
      setTimeout(() => {
        renderer.render(scene, camera);
        const dataUrl = renderer.domElement.toDataURL("image/png");
        const link = document.createElement("a");
        link.download = `${activeCharName.toLowerCase().replace(/\s+/g, '_')}_snapshot.png`;
        link.href = dataUrl;
        link.click();
      }, 160);
    });

    function makeParticleTexture(mode) {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 64, 64);

      if (mode.includes("Hearts")) {
        ctx.fillStyle = "#ff3377";
        ctx.font = "44px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("❤", 32, 34);
      } else if (mode.includes("Sparkles")) {
        const g = ctx.createRadialGradient(32, 32, 2, 32, 32, 28);
        g.addColorStop(0, "rgba(255, 255, 220, 1)");
        g.addColorStop(0.4, "rgba(255, 215, 0, 0.8)");
        g.addColorStop(1, "rgba(255, 215, 0, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 64, 64);
      } else {
        ctx.fillStyle = "#ffb3d1";
        ctx.beginPath();
        ctx.ellipse(32, 32, 18, 10, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    const pCount = 28;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount; i++) {
      pPos[i * 3] = (Math.random() - 0.5) * 2.2;
      pPos[i * 3 + 1] = Math.random() * 2.2;
      pPos[i * 3 + 2] = (Math.random() - 0.5) * 1.2 - 0.2;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({
      size: 0.085,
      map: makeParticleTexture("Sakura Petals"),
      transparent: true,
      opacity: 0.85,
      depthWrite: false
    });
    const particleSystem = new THREE.Points(pGeo, pMat);
    scene.add(particleSystem);
    let currentParticleMode = "Sakura Petals";

    function createAnimeBlush(headObj) {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 32, 4, 64, 32, 54);
      grad.addColorStop(0, 'rgba(255, 45, 115, 0.95)');
      grad.addColorStop(0.6, 'rgba(255, 80, 140, 0.55)');
      grad.addColorStop(1, 'rgba(255, 80, 140, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 64);

      const tex = new THREE.CanvasTexture(canvas);
      const geo = new THREE.PlaneGeometry(0.068, 0.036);
      const mat = new THREE.MeshBasicMaterial({
        map: tex, transparent: true, opacity: 0.0, depthWrite: false, depthTest: false
      });

      const group = new THREE.Group();
      const leftCheek = new THREE.Mesh(geo, mat);
      leftCheek.position.set(0.052, -0.005, 0.098);
      leftCheek.rotation.y = 0.22;
      leftCheek.renderOrder = 999;

      const rightCheek = new THREE.Mesh(geo, mat);
      rightCheek.position.set(-0.052, -0.005, 0.098);
      rightCheek.rotation.y = -0.22;
      rightCheek.renderOrder = 999;

      group.add(leftCheek, rightCheek);
      group.userData.mat = mat;
      headObj.add(group);
      return group;
    }

    function createAccessories(headObj) {
      const nekoGroup = new THREE.Group();
      const outerGeo = new THREE.ConeGeometry(0.045, 0.095, 4);
      const outerMat = new THREE.MeshStandardMaterial({ color: 0x22222b, roughness: 0.4 });
      const innerGeo = new THREE.ConeGeometry(0.028, 0.075, 4);
      const innerMat = new THREE.MeshBasicMaterial({ color: 0xff4da6 });

      const lEar = new THREE.Group();
      const outerMesh = new THREE.Mesh(outerGeo, outerMat);
      const innerMesh = new THREE.Mesh(innerGeo, innerMat);
      innerMesh.position.set(0, -0.005, 0.012);
      lEar.add(outerMesh, innerMesh);
      lEar.position.set(0.068, 0.175, 0.01);
      lEar.rotation.set(0.1, 0.2, -0.32);

      const rEar = lEar.clone();
      rEar.position.set(-0.068, 0.175, 0.01);
      rEar.rotation.set(0.1, -0.2, 0.32);
      nekoGroup.add(lEar, rEar);
      nekoGroup.visible = false;
      headObj.add(nekoGroup);

      const haloGeo = new THREE.TorusGeometry(0.085, 0.007, 16, 48);
      const haloMat = new THREE.MeshBasicMaterial({ color: 0xffe66d });
      const haloMesh = new THREE.Mesh(haloGeo, haloMat);
      haloMesh.rotation.x = Math.PI / 2 - 0.15;
      haloMesh.position.set(0, 0.23, 0.0);
      haloMesh.visible = false;
      headObj.add(haloMesh);

      const glassesGroup = new THREE.Group();
      const rimMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a });
      const lRim = new THREE.Mesh(new THREE.RingGeometry(0.022, 0.026, 24), rimMat);
      lRim.position.set(0.036, 0.026, 0.106);
      const rRim = new THREE.Mesh(new THREE.RingGeometry(0.022, 0.026, 24), rimMat);
      rRim.position.set(-0.036, 0.026, 0.106);
      const bridge = new THREE.Mesh(new THREE.PlaneGeometry(0.024, 0.004), rimMat);
      bridge.position.set(0, 0.028, 0.107);
      glassesGroup.add(lRim, rRim, bridge);
      glassesGroup.visible = false;
      headObj.add(glassesGroup);

      return { neko: nekoGroup, halo: haloMesh, glasses: glassesGroup };
    }

    function applyOutfitTint(vrm, tintName) {
      if (!vrm) return;
      const colorMap = {
        "Original": new THREE.Color(1.0, 1.0, 1.0),
        "Midnight Goth": new THREE.Color(0.38, 0.28, 0.48),
        "Cyber Cyan": new THREE.Color(0.65, 0.95, 1.0),
        "Crimson Red": new THREE.Color(1.0, 0.48, 0.52),
        "Emerald Mint": new THREE.Color(0.68, 1.0, 0.82)
      };
      const targetColor = colorMap[tintName] || colorMap["Original"];

      vrm.scene.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach((m) => {
            const mName = (m.name || "").toLowerCase();
            const oName = (obj.name || "").toLowerCase();
            const isBodyOrHair = mName.includes("face") || mName.includes("skin") || mName.includes("eye") || mName.includes("hair") || oName.includes("face") || oName.includes("hair");
            if (!isBodyOrHair && m.color) {
              m.color.copy(targetColor);
            }
          });
        }
      });
    }

    function setExp(exp, names, val) {
      if (!exp) return;
      for (const n of names) {
        try { exp.setValue(n, val); } catch (e) {}
      }
    }

    function speakNow(text) {
      if (!text || !('speechSynthesis' in window)) return;
      if (text === lastSpokenText) return;
      lastSpokenText = text;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.pitch = voiceSettings.pitch || 1.32;
        utter.rate = voiceSettings.rate || 1.05;

        const voices = window.speechSynthesis.getVoices();
        let chosen = null;
        const prof = voiceSettings.profile || "";

        if (prof.includes("Zira")) {
          chosen = voices.find(v => v.name.includes("Zira"));
        } else if (prof.includes("Google")) {
          chosen = voices.find(v => v.name.includes("Google") && (v.name.includes("US") || v.name.includes("Female") || v.name.includes("UK")));
        } else if (prof.includes("Samantha")) {
          chosen = voices.find(v => v.name.includes("Samantha") || v.name.includes("Victoria"));
        } else if (prof.includes("Japanese")) {
          chosen = voices.find(v => v.lang.includes("ja") || v.name.includes("Japanese") || v.name.includes("Haruka"));
        }
        if (!chosen) {
          chosen = voices.find(v => v.name.includes("Female") || v.name.includes("Zira") || v.name.includes("Samantha") || v.name.includes("Google US English"));
        }
        if (chosen) utter.voice = chosen;

        utter.onstart = () => {
          isSpeakingNow = true;
          syllableEnergy = 0.85;
          talkFallbackTimer = Math.min(10.0, Math.max(2.5, text.length * 0.065));
        };

        utter.onboundary = (e) => {
          isSpeakingNow = true;
          syllableEnergy = 1.0;
          const slice = text.slice(e.charIndex, e.charIndex + 5).toLowerCase();
          if (slice.includes('o') || slice.includes('u') || slice.includes('w')) currentVowel = 'oh';
          else if (slice.includes('e') || slice.includes('i') || slice.includes('y')) currentVowel = 'ee';
          else currentVowel = 'aa';
        };

        utter.onend = () => {
          isSpeakingNow = false;
          talkFallbackTimer = 0.0;
          syllableEnergy = 0.0;
        };
        utter.onerror = () => {
          isSpeakingNow = false;
          talkFallbackTimer = 0.0;
        };

        talkFallbackTimer = Math.min(8.0, Math.max(2.2, text.length * 0.06));
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    window.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      if (currentVrm) {
        const hits = raycaster.intersectObject(currentVrm.scene, true);
        if (hits.length > 0) {
          touchReaction = true;
          actionDuration = 4.5;
          const isMiki = activeCharName.toLowerCase().includes("miki");
          activeActionsList = isMiki ? ["angry"] : ["blush", "giggle"];
          badge.textContent = isMiki ? "Annoyed" : "Reaction";
          badge.style.display = "block";
          lastSpokenText = "";
          speakNow(
            isMiki
              ? "Watch where you're clicking."
              : `${activeCharName} noticed your tap.`
          );
          setTimeout(() => { touchReaction = false; }, 4500);
          return;
        }
      }
      if (lastSpokenText) {
        const repeat = lastSpokenText;
        lastSpokenText = "";
        speakNow(repeat);
      }
    });

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));
    const clock = new THREE.Clock();

    function loadVrmFromUrl(url, charName) {
      if (!url || url === "__VRM_URL__") return;
      if (charName) activeCharName = charName;
      if (url === loadedModelUrl && currentVrm) return;
      loadedModelUrl = url;

      status.style.display = 'block';
      status.textContent = `Summoning ${activeCharName}...`;

      if (currentVrm) {
        scene.remove(currentVrm.scene);
        try { VRMUtils.deepDispose(currentVrm.scene); } catch (e) {}
        currentVrm = null;
      }

      loader.load(
        url,
        (gltf) => {
          const vrm = gltf.userData.vrm;
          VRMUtils.removeUnnecessaryVertices(gltf.scene);
          VRMUtils.rotateVRM0(vrm);
          baseRotationY = vrm.scene.rotation.y;
          vrm.scene.traverse((obj) => { obj.frustumCulled = false; });

          const headNode = vrm.humanoid?.getNormalizedBoneNode('head');
          if (headNode) {
            blushGroup = createAnimeBlush(headNode);
            accObjects = createAccessories(headNode);
          }

          scene.add(vrm.scene);

          const h = vrm.humanoid;
          const lArm = h?.getNormalizedBoneNode('leftUpperArm');
          const rArm = h?.getNormalizedBoneNode('rightUpperArm');
          if (lArm) lArm.rotation.z = 1.18;
          if (rArm) rArm.rotation.z = -1.18;

          vrm.update(0.016);
          vrm.springBoneManager?.reset();
          clock.start();

          currentVrm = vrm;
          status.style.display = 'none';
        },
        (progress) => {
          if (progress.total > 0) {
            const pct = Math.round((progress.loaded / progress.total) * 100);
            status.textContent = `Summoning ${activeCharName}... ${pct}%`;
          }
        },
        (err) => {
          status.textContent = "Error: " + (err?.message || String(err));
          console.error(err);
        }
      );
    }

    window.applyLilyPayload = (data) => {
      if (!data) return;

      if (data.vrmUrl && data.vrmUrl !== loadedModelUrl) {
        loadVrmFromUrl(data.vrmUrl, data.charName);
      }

      if (data.voice) voiceSettings = data.voice;
      if (data.lighting) applyLightingTheme(data.lighting);
      if (data.stage) applyStageFloor(data.stage);

      if (data.actions) {
        activeActionsList = data.actions;
        actionDuration = 7.5;
        if (activeActionsList.includes("spin")) spinTimer = 1.6;
        const badgeMap = {
          blush: "Blush",
          look_away: "Averted",
          surprised: "Surprised",
          giggle: "Amused",
          wave: "Wave",
          angry: "Annoyed",
          sad: "Sad",
          happy: "Active",
          spin: "Spin",
          pose: "Pose",
          dance: "Dance"
        };
        badge.textContent = activeActionsList.map(a => badgeMap[a] || a).join(" · ");
        badge.style.display = "block";
      }

      if (data.speech) speakNow(data.speech);

      if (data.camera) {
        if (data.camera.includes("Close-Up")) {
          camPosTarget.set(0.0, 1.36, 0.95);
          ctrlTarget.set(0.0, 1.33, 0.0);
        } else if (data.camera.includes("Full-Body")) {
          camPosTarget.set(0.0, 1.05, 3.15);
          ctrlTarget.set(0.0, 0.98, 0.0);
        } else {
          camPosTarget.set(0.0, 1.30, 1.65);
          ctrlTarget.set(0.0, 1.22, 0.0);
        }
      }

      if (data.particles) {
        if (data.particles === "Off") {
          particleSystem.visible = false;
        } else {
          particleSystem.visible = true;
          if (data.particles !== currentParticleMode) {
            currentParticleMode = data.particles;
            pMat.map = makeParticleTexture(data.particles);
            pMat.needsUpdate = true;
          }
        }
      }

      if (data.accessory && accObjects.neko) {
        accObjects.neko.visible = data.accessory.includes("Neko");
        accObjects.halo.visible = data.accessory.includes("Halo");
        accObjects.glasses.visible = data.accessory.includes("Glasses");
      }

      if (data.outfit && currentVrm) {
        applyOutfitTint(currentVrm, data.outfit);
      }
    };

    try {
      const bc = new BroadcastChannel('lily_channel');
      bc.onmessage = (ev) => window.applyLilyPayload(ev.data);
    } catch (e) {}

    window.addEventListener("message", (ev) => {
      if (ev.data && ev.data.type === "LILY_STATE") window.applyLilyPayload(ev.data);
    });

    loadVrmFromUrl("__VRM_URL__", "__CHAR_NAME__");

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const t = clock.getElapsedTime();

      camera.position.lerp(camPosTarget, 0.08);
      controls.target.lerp(ctrlTarget, 0.08);

      if (sakuraFloor.visible) sakuraFloor.rotation.z = t * 0.25;

      if (particleSystem.visible) {
        const posArr = particleSystem.geometry.attributes.position.array;
        const isRising = currentParticleMode.includes("Hearts");
        for (let i = 0; i < pCount; i++) {
          posArr[i * 3] += Math.sin(t * 1.5 + i) * 0.0015;
          if (isRising) {
            posArr[i * 3 + 1] += delta * 0.28;
            if (posArr[i * 3 + 1] > 2.1) posArr[i * 3 + 1] = 0.2;
          } else {
            posArr[i * 3 + 1] -= delta * 0.22;
            if (posArr[i * 3 + 1] < 0.1) posArr[i * 3 + 1] = 2.1;
          }
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
      }

      if (currentVrm && currentVrm.humanoid) {
        const h = currentVrm.humanoid;
        const exp = currentVrm.expressionManager;

        if (spinTimer > 0) {
          spinTimer -= delta;
          const progress = Math.max(0, 1.0 - (spinTimer / 1.6));
          currentVrm.scene.rotation.y = baseRotationY + progress * Math.PI * 2;
        } else {
          currentVrm.scene.rotation.y = baseRotationY;
        }

        const spine = h.getNormalizedBoneNode('spine');
        const chest = h.getNormalizedBoneNode('chest');
        const neck = h.getNormalizedBoneNode('neck');
        const head = h.getNormalizedBoneNode('head');
        const leftUpperArm = h.getNormalizedBoneNode('leftUpperArm');
        const rightUpperArm = h.getNormalizedBoneNode('rightUpperArm');
        const leftLowerArm = h.getNormalizedBoneNode('leftLowerArm');
        const rightLowerArm = h.getNormalizedBoneNode('rightLowerArm');
        const leftHand = h.getNormalizedBoneNode('leftHand');
        const rightHand = h.getNormalizedBoneNode('rightHand');

        if (actionDuration > 0) actionDuration -= delta;
        if (talkFallbackTimer > 0) talkFallbackTimer -= delta;
        syllableEnergy = Math.max(0.25, syllableEnergy - delta * 2.2);

        const isActing = actionDuration > 0;
        const has = (act) => (touchReaction && (act === "blush" || act === "giggle" || act === "angry")) || (isActing && activeActionsList.includes(act));
        const inGaspPhase = has("surprised") && (t < 3.0 || (activeActionsList.length === 1));

        let lookTargetX = pointer.x * 0.28;
        let lookTargetY = -pointer.y * 0.18;

        let spineX = Math.sin(t * 1.6) * 0.016;
        let spineY = 0.0;
        let spineZ = Math.cos(t * 0.9) * 0.01;
        let headX = Math.sin(t * 1.4) * 0.02 + lookTargetY;
        let headY = Math.sin(t * 0.6) * 0.03 + lookTargetX;
        let headZ = Math.sin(t * 1.1) * 0.025;

        let lUp = [0.05, 0.0, 1.18];
        let rUp = [0.05, 0.0, -1.18];
        let lLow = [0.0, 0.0, 0.0];
        let rLow = [0.0, 0.0, 0.0];
        let lHnd = [0.0, 0.0, 0.0];
        let rHnd = [0.0, 0.0, 0.0];

        if (touchReaction) {
          headX = 0.16; headZ = 0.10;
          spineY = Math.sin(t * 3.0) * 0.07;
          rUp = [0.45, -0.3, -0.85]; rLow = [0.2, 1.2, 1.05];
        } else if (inGaspPhase) {
          spineX = -0.14 + Math.sin(t * 12.0) * 0.02;
          headX = -0.14; headZ = 0.0;
          lUp = [0.55, 0.35, 0.72]; rUp = [0.55, -0.35, -0.72];
          lLow = [0.25, -1.35, -1.15]; rLow = [0.25, 1.35, 1.15];
        } else {
          if (has("blush")) {
            spineY = Math.sin(t * 3.2) * 0.14;
            headX = 0.20; headZ = 0.14 + Math.sin(t * 3.5) * 0.05;
            lUp = [0.50, 0.35, 0.82]; rUp = [0.50, -0.35, -0.82];
            lLow = [0.25, -1.25, -1.12]; rLow = [0.25, 1.25, 1.12];
          }
          if (has("look_away")) { headY = 0.62; headX = 0.25; spineY = -0.18; }
          if (has("giggle") || has("happy")) {
            headZ = Math.sin(t * 6.5) * 0.055;
            headX = Math.sin(t * 10.0) * 0.02;
            spineY = Math.sin(t * 4.5) * 0.045;
          }
          if (has("wave")) {
            const swing = Math.sin(t * 9.5);
            rUp = [0.20, -0.20, -0.48];
            rLow = [0.15, 1.55, 1.15 + swing * 0.22];
            rHnd = [swing * 0.35, 0.30, 0.0];
            headZ = 0.12;
          }
          if (has("pose")) {
            headZ = -0.16; headX = 0.05; spineZ = 0.06;
            rUp = [0.45, -0.25, -0.55]; rLow = [0.2, 1.45, 1.15];
            lUp = [0.15, 0.1, 0.95]; lLow = [0.0, -0.4, -0.3];
          }
          if (has("dance")) {
            const beat = Math.sin(t * 7.5);
            spineZ = beat * 0.12; spineY = Math.cos(t * 3.75) * 0.18; headZ = -beat * 0.14;
            lUp = [0.35, 0.2, 0.65 + beat * 0.25]; rUp = [0.35, -0.2, -0.65 + beat * 0.25];
            lLow = [0.2, -1.1, -0.8]; rLow = [0.2, 1.1, 0.8];
          }
          if (has("sad")) { headX = 0.32; spineX = 0.14; }
          if (has("angry")) {
            headX = 0.12; headY = -0.25;
            lUp = [0.2, 0.0, 0.70]; rUp = [0.2, 0.0, -0.70];
            lLow = [0.0, -0.85, -0.75]; rLow = [0.0, 0.85, 0.75];
          }
        }

        if (spine) spine.rotation.set(spineX, spineY, spineZ);
        if (chest) chest.rotation.set(0.0, spineY * 0.5, 0.0);
        if (neck) neck.rotation.set(headX * 0.35, headY * 0.35, 0.0);
        if (head) head.rotation.set(headX, headY, headZ);

        if (leftUpperArm) leftUpperArm.rotation.set(...lUp);
        if (rightUpperArm) rightUpperArm.rotation.set(...rUp);
        if (leftLowerArm) leftLowerArm.rotation.set(...lLow);
        if (rightLowerArm) rightLowerArm.rotation.set(...rLow);
        if (leftHand) leftHand.rotation.set(...lHnd);
        if (rightHand) rightHand.rotation.set(...rHnd);

        if (blushGroup) {
          const showBlush = touchReaction || has("blush") || has("giggle") || has("look_away") || has("pose");
          blushGroup.userData.mat.opacity = showBlush ? (0.85 + Math.sin(t * 4.0) * 0.15) : 0.0;
        }

        if (exp) {
          const isHappy = (!has("angry")) && (touchReaction || (!inGaspPhase && (has("happy") || has("giggle") || has("wave") || has("blush") || has("pose") || has("spin") || has("dance"))));
          setExp(exp, ['happy', 'joy', 'fun'], isHappy ? 1.0 : 0.0);
          setExp(exp, ['surprised'], inGaspPhase ? 1.0 : 0.0);
          setExp(exp, ['angry'], has("angry") ? 1.0 : 0.0);
          setExp(exp, ['sad', 'sorrow'], has("sad") ? 1.0 : 0.0);

          const disableBlink = isHappy || inGaspPhase;
          const rawBlink = Math.max(0, Math.sin(t * 1.5) - 0.96) * 25;
          setExp(exp, ['blink'], disableBlink ? 0.0 : Math.min(1.0, rawBlink));

          const mouthActive = isSpeakingNow || talkFallbackTimer > 0;
          if (inGaspPhase) {
            setExp(exp, ['oh', 'o'], 0.95);
            setExp(exp, ['aa', 'a'], 0.45);
            setExp(exp, ['ee', 'e'], 0.0);
          } else if (mouthActive) {
            const pulse = Math.abs(Math.sin(t * 15.0)) * syllableEnergy;
            setExp(exp, ['aa', 'a'], currentVowel === 'aa' ? pulse * 0.9 : pulse * 0.25);
            setExp(exp, ['oh', 'o'], currentVowel === 'oh' ? pulse * 0.85 : pulse * 0.15);
            setExp(exp, ['ee', 'e', 'ih', 'i'], currentVowel === 'ee' ? pulse * 0.75 : 0.0);
          } else {
            setExp(exp, ['aa', 'a'], 0.0);
            setExp(exp, ['oh', 'o'], 0.0);
            setExp(exp, ['ee', 'e', 'ih', 'i'], 0.0);
          }
        }

        currentVrm.update(delta);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
