<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #fff0f6 0%, #ffd6e7 100%);
      font-family: sans-serif;
    }
    canvas { width: 100vw; height: 100vh; display: block; }
    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.85);
      color: #d63384;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }
    .controls {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.8);
      padding: 7px 10px;
      border-radius: 24px;
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.25);
      z-index: 10;
    }
    .btn {
      border: 1px solid #ffb3d9;
      background: white;
      color: #c2185b;
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:active {
      background: #ff69b4;
      color: white;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="status">🌸 Summoning Lily-Hime...</div>

  <div class="controls">
    <button class="btn" onclick="triggerAction('wave')">👋 Wave</button>
    <button class="btn" onclick="triggerAction('happy')">😊 Happy</button>
    <button class="btn" onclick="triggerAction('dance')">💃 Dance</button>
    <button class="btn" onclick="speakReply()">🔊 Voice</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    const status = document.getElementById('status');
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(28.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
    camera.position.set(0.0, 1.25, 2.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, 1.15, 0.0);
    controls.enableDamping = true;
    controls.update();

    const scene = new THREE.Scene();

    const dirLight = new THREE.DirectionalLight(0xfff5f8, 1.35);
    dirLight.position.set(1.0, 1.5, 1.5);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));

    const lookAtTarget = new THREE.Object3D();
    camera.add(lookAtTarget);

    const b64 = "__VRM_BASE64__";
    const lastReply = "__LAST_REPLY__";

    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blobUrl = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));

    let currentVrm = null;
    let baseHipsY = 0;
    let actionMode = "idle";
    let actionTimer = 0;
    let talkTimer = 0;

    window.triggerAction = (mode) => {
      actionMode = mode;
      actionTimer = 3.5;
    };

    window.speakReply = () => {
      const textToSay = lastReply || "Konnichiwa Master katanaking!";
      talkTimer = Math.min(7.0, Math.max(2.5, textToSay.length * 0.06));
      window.triggerAction("happy");

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(textToSay);
        utter.pitch = 1.4;
        utter.rate = 1.05;

        const voices = window.speechSynthesis.getVoices();
        const femVoice = voices.find(v =>
          v.name.includes("Female") ||
          v.name.includes("Zira") ||
          v.name.includes("Google UK English Female") ||
          v.name.includes("Samantha")
        );
        if (femVoice) utter.voice = femVoice;

        utter.onstart = () => { talkTimer = 15.0; };
        utter.onend = () => { talkTimer = 0.0; };
        utter.onerror = () => { talkTimer = 0.0; };

        window.speechSynthesis.speak(utter);
      }
    };

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load(
      blobUrl,
      (gltf) => {
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.rotateVRM0(vrm);
        vrm.scene.traverse((obj) => { obj.frustumCulled = false; });

        if (vrm.lookAt) vrm.lookAt.target = lookAtTarget;

        // Store initial hips Y so breathing animations don't collapse the model's height
        const hips = vrm.humanoid?.getNormalizedBoneNode('hips');
        if (hips) baseHipsY = hips.position.y;

        // Auto-frame camera to model's head/chest height
        const head = vrm.humanoid?.getNormalizedBoneNode('head');
        if (head) {
          vrm.scene.updateMatrixWorld(true);
          const headPos = new THREE.Vector3();
          head.getWorldPosition(headPos);
          controls.target.set(0.0, headPos.y - 0.12, 0.0);
          camera.position.set(0.0, headPos.y - 0.05, 2.15);
          controls.update();
        }

        scene.add(vrm.scene);
        currentVrm = vrm;
        status.style.display = 'none';

        if (lastReply && lastReply.length > 0) {
          window.speakReply();
          if (lastReply.toLowerCase().includes("konnichiwa")) {
            window.triggerAction("wave");
          }
        }
      },
      undefined,
      (error) => {
        status.textContent = "⚠️ Error loading VRM";
        console.error(error);
      }
    );

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      if (currentVrm && currentVrm.humanoid) {
        const h = currentVrm.humanoid;
        const exp = currentVrm.expressionManager;

        const hips = h.getNormalizedBoneNode('hips');
        const spine = h.getNormalizedBoneNode('spine');
        const chest = h.getNormalizedBoneNode('chest');
        const head = h.getNormalizedBoneNode('head');
        const leftUpperArm = h.getNormalizedBoneNode('leftUpperArm');
        const rightUpperArm = h.getNormalizedBoneNode('rightUpperArm');
        const leftLowerArm = h.getNormalizedBoneNode('leftLowerArm');
        const rightLowerArm = h.getNormalizedBoneNode('rightLowerArm');
        const rightHand = h.getNormalizedBoneNode('rightHand');

        if (actionTimer > 0) {
          actionTimer -= delta;
          if (actionTimer <= 0) actionMode = "idle";
        }
        if (talkTimer > 0) talkTimer -= delta;

        // 1. Breathing & Idle Sway (Preserving baseHipsY)
        if (hips) {
          hips.position.y = baseHipsY + Math.sin(t * 2.2) * 0.008;
          hips.rotation.y = 0;
          hips.rotation.z = Math.sin(t * 1.1) * 0.025;
        }
        if (spine) {
          spine.rotation.x = Math.sin(t * 2.0) * 0.025;
          spine.rotation.z = Math.cos(t * 1.1) * 0.02;
        }
        if (chest) {
          chest.rotation.y = Math.sin(t * 0.9) * 0.04;
        }
        if (head) {
          head.rotation.z = Math.sin(t * 1.3) * 0.045;
          head.rotation.x = Math.sin(t * 1.7) * 0.03;
          head.rotation.y = Math.sin(t * 0.7) * 0.06;
        }

        // 2. Corrected Natural Arm Rest Pose (Three-VRM v3 Normalized Axes)
        if (leftUpperArm) {
          leftUpperArm.rotation.set(0.08, 0.0, -1.22 - Math.sin(t * 2.0) * 0.03);
        }
        if (leftLowerArm) {
          leftLowerArm.rotation.set(0.0, -0.25, -0.15);
        }
        if (rightUpperArm) {
          rightUpperArm.rotation.set(0.08, 0.0, 1.22 + Math.sin(t * 2.0) * 0.03);
        }
        if (rightLowerArm) {
          rightLowerArm.rotation.set(0.0, 0.25, 0.15);
        }
        if (rightHand) {
          rightHand.rotation.set(0.0, 0.0, 0.0);
        }

        // 3. Action Poses (Wave / Dance)
        if (actionMode === "wave" && rightUpperArm && rightLowerArm) {
          // Lift right upper arm slightly above horizontal and angle forward
          rightUpperArm.rotation.set(0.35, 0.0, -0.35);
          // Bend elbow upward toward head and wave forearm back and forth
          rightLowerArm.rotation.set(0.0, 0.3, -1.25 + Math.sin(t * 10.0) * 0.35);
          if (rightHand) {
            rightHand.rotation.z = Math.sin(t * 10.0) * 0.25;
          }
          if (head) head.rotation.z = -0.12;
        } else if (actionMode === "dance") {
          if (hips) {
            hips.position.y = baseHipsY + Math.abs(Math.sin(t * 6.0)) * 0.045;
            hips.rotation.y = Math.sin(t * 3.0) * 0.18;
            hips.rotation.z = Math.sin(t * 3.0) * 0.08;
          }
          if (leftUpperArm && rightUpperArm) {
            leftUpperArm.rotation.z = -0.85 + Math.sin(t * 6.0) * 0.3;
            rightUpperArm.rotation.z = 0.85 + Math.cos(t * 6.0) * 0.3;
          }
          if (leftLowerArm && rightLowerArm) {
            leftLowerArm.rotation.z = -0.6 + Math.sin(t * 6.0) * 0.2;
            rightLowerArm.rotation.z = 0.6 - Math.cos(t * 6.0) * 0.2;
          }
          if (head) head.rotation.z = Math.sin(t * 3.0) * 0.12;
        }

        // 4. Facial Expressions & Lip-Sync
        if (exp) {
          const isHappy = (actionMode !== "idle");
          exp.setValue('happy', isHappy ? 0.85 : 0.15);

          const rawBlink = Math.max(0, Math.sin(t * 1.4) - 0.96) * 25;
          exp.setValue('blink', isHappy ? 0.0 : Math.min(1.0, rawBlink));

          if (talkTimer > 0) {
            exp.setValue('aa', Math.abs(Math.sin(t * 13.0)) * 0.75);
            exp.setValue('oh', Math.abs(Math.cos(t * 9.0)) * 0.35);
          } else {
            exp.setValue('aa', 0.0);
            exp.setValue('oh', 0.0);
          }
        }

        currentVrm.update(delta);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
