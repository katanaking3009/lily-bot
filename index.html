<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin: 0; overflow: hidden; background-color: #FFFDF9; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com",
          "three/addons/": "https://unpkg.com",
          "@pixiv/three-vrm": "https://unpkg.com"
        }
      }
    </script>
</head>
<body>
    <canvas id="avatarCanvas"></canvas>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0.0, 1.35, 1.1); 

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('avatarCanvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(1.0, 1.0, 1.0).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));

        let currentVrm = null;

        // FIXED TARGET: Point directly to your GitHub raw asset repository path!
        const vrmUrl = 'https://githubusercontent.com';

        loader.load(
            vrmUrl,
            (gltf) => {
                const vrm = gltf.userData.vrm;
                currentVrm = vrm;
                scene.add(vrm.scene);
                vrm.scene.rotation.y = Math.PI; 
                
                if (vrm.humanoid) {
                    const leftArm = vrm.humanoid.getRawBoneNode('leftUpperArm');
                    const rightArm = vrm.humanoid.getRawBoneNode('rightUpperArm');
                    if (leftArm) leftArm.rotation.z = -1.1;
                    if (rightArm) rightArm.rotation.z = 1.1;
                }
            },
            (progress) => {},
            (error) => console.error('Error loading VRM asset:', error)
        );

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (currentVrm) {
                currentVrm.update(deltaTime);
                const spine = currentVrm.humanoid.getRawBoneNode('spine');
                if (spine) {
                    spine.rotation.z = Math.sin(elapsedTime * 2.0) * 0.008;
                    spine.rotation.x = Math.cos(elapsedTime * 1.5) * 0.005;
                }
                const blinkTiming = Math.sin(elapsedTime * 0.8);
                if (currentVrm.expressionManager) {
                    if (blinkTiming > 0.95) {
                        currentVrm.expressionManager.setValue('blink', 1.0);
                    } else {
                        currentVrm.expressionManager.setValue('blink', 0.0);
                    }
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
