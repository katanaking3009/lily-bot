<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #status { position: absolute; top: 10px; left: 10px; color: #888; font-family: sans-serif; font-size: 14px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="status">Loading Lily...</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    const status = document.getElementById('status');
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(30.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
    camera.position.set(0.0, 1.3, 2.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, 1.2, 0.0);
    controls.update();

    const scene = new THREE.Scene();
    const light = new THREE.DirectionalLight(0xffffff, Math.PI);
    light.position.set(1.0, 1.0, 1.0).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    // Convert injected Base64 string into a loadable Blob URL
    const b64 = "__VRM_BASE64__";
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blobUrl = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));

    let currentVrm = null;
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load(
      blobUrl,
      (gltf) => {
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.rotateVRM0(vrm); // Fixes backwards-facing VRM 0.x models
        vrm.scene.traverse((obj) => { obj.frustumCulled = false; });

        // Relax arms down from default T-pose
        const leftArm = vrm.humanoid?.getNormalizedBoneNode('leftUpperArm');
        const rightArm = vrm.humanoid?.getNormalizedBoneNode('rightUpperArm');
        if (leftArm) leftArm.rotation.z = -1.1;
        if (rightArm) rightArm.rotation.z = 1.1;

        scene.add(vrm.scene);
        currentVrm = vrm;
        status.style.display = 'none';
      },
      undefined,
      (error) => {
        status.textContent = 'Error loading VRM model';
        console.error(error);
      }
    );

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      if (currentVrm) {
        // Subtle breathing sway and periodic blinking
        const spine = currentVrm.humanoid?.getNormalizedBoneNode('spine');
        if (spine) spine.rotation.x = Math.sin(elapsed * 2) * 0.02;

        const blink = Math.max(0, Math.sin(elapsed * 1.5) - 0.95) * 20;
        currentVrm.expressionManager?.setValue('blink', Math.min(1, blink));

        currentVrm.update(delta);
      }
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
