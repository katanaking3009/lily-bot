<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lily Bot 3D</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Three.js and loaders -->
  <script src="../three.min.js"></script>
<script src="../GLTFLoader.js"></script>
<script src="../three-vrm.js"></script>

  <script>
    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeeeeee);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 1.5, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 1, 1).normalize();
    scene.add(light);

    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);

    // VRM loader
    const loader = new THREE.GLTFLoader();
   loader.load('../lily_model.vrm', ...);

      (gltf) => {
        THREE.VRM.from(gltf).then((vrm) => {
          scene.add(vrm.scene);
          console.log('✅ Lily VRM loaded successfully');
        });
      },
      (progress) => {
        console.log('Loading Lily...', (100.0 * progress.loaded / progress.total).toFixed(2), '%');
      },
      (error) => {
        console.error('❌ Error loading Lily VRM:', error);
      }
    );

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
