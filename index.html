<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lily-Hime 3D Avatar Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
 <script type="module">
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js";
  import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/loaders/GLTFLoader.js";
  import { VRM } from "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@latest/lib/three-vrm.module.js";


    // Debug: confirm imports
    console.log("THREE keys:", Object.keys(THREE));
    console.log("GLTFLoader:", GLTFLoader);
    console.log("VRM:", VRM);

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeeeeee);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.4, 2);

    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 1, 1).normalize();
    scene.add(light);

    // ✅ Load Lily VRM model
    const loader = new GLTFLoader();
    loader.load(
      "https://cdn.jsdelivr.net/gh/katanaking3009/lily-bot/lily_model.vrm",
      (gltf) => {
        VRM.from(gltf).then((vrm) => {
          scene.add(vrm.scene);
          console.log("✅ Lily VRM loaded!");
        });
      },
      undefined,
      (error) => console.error("⚠️ Error loading Lily VRM:", error)
    );

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
