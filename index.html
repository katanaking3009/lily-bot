<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lily-Hime 3D Room Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #FFFDF9; font-family: sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #debugLog { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px; border-radius: 5px; font-size: 12px; max-width: 90%; z-index: 100; }
    </style>
    
    <!-- Look for files directly in the root repository directory -->
    <script src="three.min.js"></script>
    <script src="GLTFLoader.js"></script>
    <script src="three-vrm.js"></script>
</head>
<body>
    <div id="debugLog">Initializing 3D Room Viewer...</div>
    <canvas id="avatarCanvas"></canvas>
    
    <script>
        const logger = document.getElementById('debugLog');
        function logStatus(msg, isError = false) {
            logger.innerText = msg;
            if (isError) logger.style.background = "rgba(255,0,0,0.8)";
        }

        try {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20.0);
            camera.position.set(0.0, 1.35, 1.1); 

            const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('avatarCanvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(1.0, 1.0, 1.0).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            logStatus("Downloading lily_model.vrm...");

            const loader = new THREE.GLTFLoader();
            loader.setCrossOrigin('anonymous'); 

            let currentVrm = null;
            const vrmUrl = 'https://githubusercontent.com';

            loader.load(
                vrmUrl,
                (gltf) => {
                    THREE.VRM.from(gltf).then((vrm) => {
                        currentVrm = vrm;
                        scene.add(vrm.scene);
                        vrm.scene.rotation.y = Math.PI; 
                        
                        if (vrm.humanoid) {
                            const leftArm = vrm.humanoid.getBoneNode(THREE.VRMBoneName.LeftUpperArm);
                            const rightArm = vrm.humanoid.getBoneNode(THREE.VRMBoneName.RightUpperArm);
                            if (leftArm) leftArm.rotation.z = -1.1;
                            if (rightArm) rightArm.rotation.z = 1.1;
                        }
                        logger.style.display = "none"; 
                    }).catch(err => {
                        console.error(err);
                        logStatus("VRM Processing Error: The model data parsed incorrectly.", true);
                    });
                },
                (progress) => {
                    if (progress.total > 0) {
                        logStatus(`Loading Lily-Hime: ${Math.round((progress.loaded / progress.total) * 100)}%`);
                    }
                },
                (error) => {
                    console.error(error);
                    logStatus("Network Error: Failed to fetch the .vrm file.", true);
                }
            );

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const deltaTime = clock.getDelta();
                const elapsedTime = clock.getElapsedTime();

                if (currentVrm) {
                    currentVrm.update(deltaTime);
                    const spine = currentVrm.humanoid.getBoneNode(THREE.VRMBoneName.Spine);
                    if (spine) {
                        spine.rotation.z = Math.sin(elapsedTime * 2.0) * 0.008;
                        spine.rotation.x = Math.cos(elapsedTime * 1.5) * 0.005;
                    }
                    const blinkTiming = Math.sin(elapsedTime * 0.8);
                    if (currentVrm.blendShapeProxy) {
                        if (blinkTiming > 0.95) {
                            currentVrm.blendShapeProxy.setValue(THREE.VRMBlendShapePresetName.Blink, 1.0);
                        } else {
                            currentVrm.blendShapeProxy.setValue(THREE.VRMBlendShapePresetName.Blink, 0.0);
                        }
                    }
                }
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

        } catch (globalError) {
            logStatus(`Script Crash: ${globalError.message}`, true);
        }
    </script>
</body>
</html>
