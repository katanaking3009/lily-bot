<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lily Bot 3D</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script src="three.min.js"></script>
  <script src="GLTFLoader.js"></script>
</head>
<body>
  <script>
    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeeeeee);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.4, 2);

    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 1, 1).normalize();
    scene.add(light);

    // Load Lily GLB model from your hosted link
   const loader = new THREE.GLTFLoader();
loader.load('https://drive.google.com/uc?export=download&id=1gzmx_xBaNR6ApnlhgLAeEzAw056eggxi',
  function(gltf) {
    scene.add(gltf.scene);
    console.log("✅ Lily GLB loaded from Google Drive!");
  },
  undefined,
  function(error) {
    console.error("⚠️ Error loading Lily model:", error);
  }
);


    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
